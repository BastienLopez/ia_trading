name: aitrading

x-app-build: &app-build
  context: ../
  dockerfile: docker/Dockerfile
  args:
    ONNXRUNTIME_PACKAGE: onnxruntime

x-base-environment: &base-environment
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: /app
  TF_CPP_MIN_LOG_LEVEL: "2"

x-app-common: &app-common
  image: aitrading-app:latest
  build: *app-build
  working_dir: /app
  volumes:
    - ../:/app
  environment:
    <<: *base-environment
  restart: unless-stopped

services:
  dashboard:
    <<: *app-common
    container_name: ai_trading_dashboard
    command: ["python3", "-m", "ai_trading.dashboard.app"]
    ports:
      - "8050:8050"
    environment:
      <<: *base-environment
      DASH_DEBUG: "true"
      HOST: 0.0.0.0
      PORT: "8050"
      API_URL: http://ai_api:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai_api:
    <<: *app-common
    container_name: ai_trading_api
    # Le dépôt contient ai_trading/api.py et ai_trading/api/.
    # On charge explicitement le fichier api.py pour éviter le conflit d'import.
    command:
      - python3
      - -c
      - >-
        import runpy, uvicorn;
        module = runpy.run_path('/app/ai_trading/api.py');
        uvicorn.run(module['app'], host='0.0.0.0', port=8000)
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web_app:
    <<: *app-common
    container_name: ai_trading_web_app
    command: ["python3", "-m", "web_app.app"]
    ports:
      - "5000:5000"
    environment:
      <<: *base-environment
      API_URL: http://ai_api:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      ai_api:
        condition: service_healthy
      db:
        condition: service_healthy

  db:
    container_name: ai_trading_db
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: ai_trading
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_trading"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    container_name: ai_trading_redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
